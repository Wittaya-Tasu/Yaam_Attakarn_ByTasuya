<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ยามอัฐกาล + กาลชะตา (Integration Demo)</title><link rel="stylesheet" href="./kala-tab.css"><style>body{margin:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif}.app-tabs{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #dde3ea;display:flex;padding:8px max(10px,env(safe-area-inset-left));gap:6px}.app-tab{min-height:44px;border:0;border-radius:10px;padding:8px 14px;background:#eef2f6;font-weight:700}.app-tab.active{background:#1f5d8f;color:#fff}.panel{display:none}.panel.active{display:block}.placeholder{max-width:780px;margin:20px auto;padding:18px;background:white;border-radius:14px;color:#687386}</style></head><body><nav class="app-tabs"><button class="app-tab active" data-tab="yam">ยามอัฐกาลเดิม</button><button class="app-tab" data-tab="kala">กาลชะตา</button></nav><main><section id="yam" class="panel active"><div class="placeholder">พื้นที่นี้แทน WebApp ยามอัฐกาลเดิม — โมดูลกาลชะตาไม่อ่านหรือเขียน state ของส่วนนี้</div></section><section id="kala" class="panel"><div id="kala-root"></div></section></main><script type="module">import{mountKalaChataTab}from'./kala-tab.js';let kalaApp=null;document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));if(b.dataset.tab==='kala'&&!kalaApp)kalaApp=mountKalaChataTab(document.getElementById('kala-root'));}));</script></body></html>
